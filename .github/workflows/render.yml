name: render

on:
  push:
    branches: [main]
    paths:
      - 'productions/**/spec.json'
      - 'ci/trigger.txt'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Production slug (folder under productions/)'
        required: true
        default: '0000-sample'

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log
        run: |
          mkdir -p build
          : > build/ci.log
          echo "setup" > build/current_step
          echo "Run ${{ github.run_id }} for ${{ github.sha }} (${{ github.event_name }})" | tee -a build/ci.log

      - name: Mark run started
        continue-on-error: true
        run: bash ci/started.sh

      - name: Determine productions
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.slug }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          echo "determine" > build/current_step
          if [ "$EVENT" = "workflow_dispatch" ]; then
            slugs="$INPUT_SLUG"
          else
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA")
            else
              changed=$(git diff-tree --root --no-commit-id --name-only -r --diff-filter=AM "$SHA")
            fi
            echo "Changed files:"
            echo "$changed"
            slugs=$(echo "$changed" | grep -E '^productions/[^/]+/spec\.json$' | cut -d/ -f2 || true)
            if echo "$changed" | grep -qx 'ci/trigger.txt'; then slugs="$slugs 0000-sample"; fi
          fi
          slugs=$(for s in $slugs; do echo "$s"; done | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "Productions to render: ${slugs:-none}" | tee -a build/ci.log
          echo "SLUGS=$slugs" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache npm and Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
          key: deps-${{ runner.os }}-${{ hashFiles('render/package.json', 'pipeline/requirements.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install system packages
        if: env.SLUGS != ''
        timeout-minutes: 10
        run: bash ci/run-step.sh setup:apt bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng"

      - name: Install Python packages
        if: env.SLUGS != ''
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:pip bash -c "python -m pip install --upgrade pip && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -r pipeline/requirements.txt"

      - name: Install Remotion
        if: env.SLUGS != ''
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:npm bash -c "cd render && npm install --no-audit --no-fund && npx remotion browser ensure"

      - name: Render
        if: env.SLUGS != ''
        timeout-minutes: 45
        run: |
          for slug in $SLUGS; do
            bash ci/render-slug.sh "$slug"
          done

      - name: Finalize (always)
        if: always()
        run: bash ci/finalize.sh "${{ job.status }}"
