name: render

on:
  push:
    branches: [main]
    paths:
      - 'productions/**/spec.json'
      - 'ci/trigger.txt'
      - 'ci/rerender.txt'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Production slug (folder under productions/)'
        required: true
        default: '0000-sample'

permissions:
  contents: write

# No workflow-level concurrency: every production renders in its own matrix job with its own concurrency group
# (render-<slug>), so a real production never waits for the test production or the library, and a newer push
# can only replace a pending run of the SAME production (which then renders the newer spec).
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.plan.outputs.slugs }}
      tts: ${{ steps.plan.outputs.tts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine productions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.slug }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            slugs="$INPUT_SLUG"
          else
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA")
            else
              changed=$(git diff-tree --root --no-commit-id --name-only -r --diff-filter=AM "$SHA")
            fi
            echo "Changed files:"
            echo "$changed"
            slugs=$(echo "$changed" | grep -E '^productions/[^/]+/spec\.json$' | cut -d/ -f2 || true)
            if echo "$changed" | grep -qx 'ci/trigger.txt'; then slugs="$slugs 0000-sample"; fi
            # Factory re-render without touching a production's files: every line '<slug>' (after an optional
            # timestamp, '#' starts a comment) of ci/rerender.txt whose productions/<slug>/spec.json exists
            if echo "$changed" | grep -qx 'ci/rerender.txt'; then
              for s in $(sed 's/#.*//' ci/rerender.txt | grep -Eo '[a-z0-9][a-z0-9-]*[a-z0-9]' || true); do
                if [ -f "productions/$s/spec.json" ]; then echo "Re-render requested: $s"; slugs="$slugs $s"; fi
              done
            fi
            # Catch up on renders that were lost because a newer push replaced a pending run
            # (concurrency keeps only one pending run): every real production whose spec.json
            # was committed after its render-report.json (or that has none yet) is rendered too.
            for spec in productions/*/spec.json; do
              s=$(basename "$(dirname "$spec")")
              [ "$s" = "0000-sample" ] && continue
              st=$(git log -1 --format=%ct -- "$spec")
              rt=$(git log -1 --format=%ct -- "productions/$s/render-report.json")
              # ci/runs/<slug>.json is committed when a render of that production starts: skip it when a
              # render already started after the spec was committed (it is running or has already failed)
              mt=$(git log -1 --format=%ct -- "ci/runs/$s.json")
              if [ -n "$mt" ] && [ -n "$st" ] && [ "$mt" -ge "$st" ]; then continue; fi
              # a production that never got its release (e.g. its release step failed) is rendered again once
              if [ -n "$st" ] && ! gh release view "$s" >/dev/null 2>&1; then
                echo "Catch-up: $s (no release '$s' yet)"
                slugs="$slugs $s"
                continue
              fi
              if [ -n "$st" ] && { [ -z "$rt" ] || [ "$st" -gt "$rt" ]; }; then
                echo "Catch-up: $s (spec newer than its render report)"
                slugs="$slugs $s"
              fi
            done
          fi
          slugs=$(for s in $slugs; do echo "$s"; done | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "Productions to render: ${slugs:-none}"
          json=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' $slugs)
          echo "slugs=$json" >> "$GITHUB_OUTPUT"
          # Chatterbox productions: TTS fan-out over several runners (job 'tts' below)
          tts=$(python3 ci/tts-plan.py $slugs || echo '[]')
          echo "TTS fan-out: $tts"
          echo "tts=$tts" >> "$GITHUB_OUTPUT"

  # VOICE-6: Chatterbox needs ~7-10 s of CPU per second of speech, far too slow for one runner. Every runner of this
  # matrix generates one deterministic share of the clips (pipeline/tts.py --shard i/n) and uploads them; the render
  # job downloads them into its TTS cache. A failed or slow shard never blocks the render: missing clips are
  # generated there (within SOP_TTS_BUDGET_MIN) or fall back to Kokoro and are reported by QA.
  tts:
    needs: plan
    if: needs.plan.outputs.tts != '[]' && needs.plan.outputs.tts != ''
    name: tts ${{ matrix.slug }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tts) }}
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DEBIAN_FRONTEND: noninteractive
      SOP_TTS_BUDGET_MIN: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-chatterbox.txt

      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
          key: deps-${{ runner.os }}-${{ hashFiles('render/package.json', 'pipeline/requirements.txt', 'pipeline/requirements-chatterbox.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache Chatterbox venv
        uses: actions/cache@v4
        with:
          path: ~/.venvs/chatterbox
          key: cbvenv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('pipeline/requirements-chatterbox.txt') }}

      - name: Install packages
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r pipeline/requirements.txt

      - name: Generate clips
        timeout-minutes: 32
        run: |
          python pipeline/tts_redo.py || true  # VOICE-13: cached clips still judged bad get one deep retry
          python pipeline/tts.py --slug "${{ matrix.slug }}" --shard "${{ matrix.shard }}/${{ matrix.shards }}" \
            --export "build/tts-out"

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.slug }}-${{ matrix.shard }}
          path: build/tts-out
          retention-days: 2
          if-no-files-found: ignore

  render:
    needs: [plan, tts]
    # runs when 'tts' succeeded, failed or was skipped (no Chatterbox production)
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.slugs != '[]' && needs.plan.outputs.slugs != '' }}
    name: render ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    concurrency:
      group: render-${{ matrix.slug }}
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SLUGS: ${{ matrix.slug }}
      PYTHONUNBUFFERED: '1'
      SOP_TTS_BUDGET_MIN: '20'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log
        run: |
          mkdir -p build
          : > build/ci.log
          echo "setup" > build/current_step
          echo "Run ${{ github.run_id }} for ${{ github.sha }} (${{ github.event_name }})" | tee -a build/ci.log

      - name: Mark run started
        continue-on-error: true
        run: bash ci/started.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-chatterbox.txt

      - name: Cache Chatterbox venv
        if: contains(needs.plan.outputs.tts, format('"{0}"', matrix.slug))
        uses: actions/cache@v4
        with:
          path: ~/.venvs/chatterbox
          key: cbvenv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('pipeline/requirements-chatterbox.txt') }}

      - name: Cache npm and Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
          key: deps-${{ runner.os }}-${{ hashFiles('render/package.json', 'pipeline/requirements.txt', 'pipeline/requirements-chatterbox.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Fetch fan-out TTS clips
        if: contains(needs.plan.outputs.tts, format('"{0}"', matrix.slug))
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: tts-${{ matrix.slug }}-*
          merge-multiple: true
          path: ~/.cache/huggingface/sop-tts/chatterbox

      - name: Install system packages
        timeout-minutes: 10
        run: bash ci/run-step.sh setup:apt bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fluid-soundfont-gm"

      - name: Install Python packages
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:pip bash -c "python -m pip install --upgrade pip && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -r pipeline/requirements.txt && (pip install --no-deps tinysoundfont==0.3.7 || echo 'tinysoundfont unavailable: classic generated music')"

      - name: Install Remotion
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:npm bash -c "cd render && npm install --no-audit --no-fund && npx remotion browser ensure"

      - name: Render
        timeout-minutes: 100
        run: |
          python pipeline/tts_redo.py || true  # VOICE-13: cached clips still judged bad get one deep retry
          bash ci/render-all.sh

      - name: Finalize (always)
        if: always()
        run: bash ci/finalize.sh "${{ job.status }}"
