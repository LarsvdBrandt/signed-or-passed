name: voice-test

# VOICE-5: voice A/B test (ci/render-voice-test.sh) -> release 'voice-test' with voice-ab-1/2/3.mp4 and
# voice-ab-report.json (WER, liveliness, TTS seconds per audio second = the Chatterbox CPU benchmark).
# Separate from render.yml so that productions never wait for it. Start it from the Actions tab or by pushing
# ci/voice-test.txt.
on:
  push:
    branches: [main]
    paths:
      - 'ci/voice-test.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-test
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SLUGS: voice-test
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log
        run: |
          mkdir -p build
          : > build/ci.log
          echo "setup" > build/current_step
          echo voice-test > build/current_slug
          echo "Voice test run ${{ github.run_id }} for ${{ github.sha }} (${{ github.event_name }})" | tee -a build/ci.log

      - name: Mark run started
        continue-on-error: true
        run: bash ci/started.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-chatterbox.txt

      - name: Cache npm and Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
          key: deps-${{ runner.os }}-${{ hashFiles('render/package.json', 'pipeline/requirements.txt', 'pipeline/requirements-chatterbox.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install system packages
        timeout-minutes: 10
        run: bash ci/run-step.sh setup:apt bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng"

      - name: Install Python packages
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:pip bash -c "python -m pip install --upgrade pip && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -r pipeline/requirements.txt"

      - name: Install Remotion
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:npm bash -c "cd render && npm install --no-audit --no-fund && npx remotion browser ensure"

      - name: Voice A/B
        timeout-minutes: 70
        run: bash ci/render-voice-test.sh build/voice-test/out

      - name: Release 'voice-test'
        if: always()
        run: |
          shopt -s nullglob
          files=(build/voice-test/out/*.mp4 build/voice-test/out/*.json)
          [ "${#files[@]}" -gt 0 ] || { echo "nothing to release"; exit 0; }
          bash ci/run-step.sh release:voice-test bash ci/release.sh voice-test "Voice A/B: Kokoro vs Chatterbox (narrator / default)" "${files[@]}"

      - name: Finalize (always)
        if: always()
        run: bash ci/finalize.sh "${{ job.status }}"
