name: voice-test-2

# VOICE-10c listening test (ci/render-voice-test.sh with VOICE_SET=vt2) -> release 'voice-test-2': the same ~70 s
# Blockbuster excerpt in 5 voice variants A-E (ci/voice-ab.py), each as <letter>-<name>.mp3 (dry voice) and .mp4
# (full video), every file starting with a 1 s beep gap, + voice-test-2-report.json (WER, liveliness, wpm, UTMOS).
# Separate from render.yml so that productions never wait for it. Start it from the Actions tab or by pushing
# ci/voice-test-2.txt.
on:
  push:
    branches: [main]
    paths:
      - 'ci/voice-test-2.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-test-2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GH_TOKEN: ${{ github.token }}
      SLUGS: voice-test-2
      VOICE_SET: vt2
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log
        run: |
          mkdir -p build
          : > build/ci.log
          echo "setup" > build/current_step
          echo voice-test-2 > build/current_slug
          echo "Voice test run ${{ github.run_id }} for ${{ github.sha }} (${{ github.event_name }})" | tee -a build/ci.log

      - name: Mark run started
        continue-on-error: true
        run: bash ci/started.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-chatterbox.txt

      - name: Cache npm and Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
            ~/.cache/torch/hub
          key: deps-${{ runner.os }}-${{ hashFiles('render/package.json', 'pipeline/requirements.txt', 'pipeline/requirements-chatterbox.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install system packages
        timeout-minutes: 10
        run: bash ci/run-step.sh setup:apt bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng"

      - name: Install Python packages
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:pip bash -c "python -m pip install --upgrade pip && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -r pipeline/requirements.txt"

      - name: Install Remotion
        timeout-minutes: 15
        run: bash ci/run-step.sh setup:npm bash -c "cd render && npm install --no-audit --no-fund && npx remotion browser ensure"

      - name: Voice listening test A-E
        timeout-minutes: 150
        run: bash ci/render-voice-test.sh build/voice-test/out

      - name: Release 'voice-test-2'
        if: always()
        run: |
          shopt -s nullglob
          files=(build/voice-test/out/*.mp3 build/voice-test/out/*.mp4 build/voice-test/out/*.json)
          [ "${#files[@]}" -gt 0 ] || { echo "nothing to release"; exit 0; }
          bash ci/run-step.sh release:voice-test-2 bash ci/release.sh voice-test-2 "Voice listening test 2: A Kokoro / B-E Chatterbox without stretch (B sentences, C-E paragraphs)" "${files[@]}"

      - name: Finalize (always)
        if: always()
        run: bash ci/finalize.sh "${{ job.status }}"
